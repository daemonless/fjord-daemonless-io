# Zensical configuration for fjord.daemonless.io
# Build: make build   Preview: make serve

[project]
site_name = "fjord"
site_url = "https://fjord.daemonless.io"
site_description = "FJORD (FreeBSD Jail Orchestration Runtime Descriptor) — An open standard and native compose platform for FreeBSD containers."
repo_url = "https://github.com/daemonless/fjord"
repo_name = "daemonless/fjord"
edit_uri = "https://github.com/daemonless/fjord-daemonless-io/edit/main/docs/"
site_dir = "site"

extra_css = [
  "stylesheets/extra.css",
]

extra_javascript = [
  "javascripts/lightbox.js",
  "javascripts/demo-video.js",
]

nav = [
  { "Overview" = "index.md" },
  { "Docs" = [
    { "Installation" = "install.md" },
    { "Operations" = "using.md" },
    { "Updates" = "updates.md" },
    { "Networking" = "networking.md" },
    { "Architecture" = "concepts.md" },
    { "Troubleshooting" = "troubleshooting.md" },
    { "Roadmap" = "roadmap.md" },
  ] },
  { "Specification" = "spec.md" },
  { "daemonless.io" = "https://daemonless.io" },
]

[project.theme]
variant = "modern"
custom_dir = "overrides"
logo = "img/fjord-logo.svg"
favicon = "img/favicon.png"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "navigation.path",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.instant.preview",
  "navigation.instant.prefetch",
  "search.highlight",
  "search.suggest",
  "search.share",
  "toc.follow",
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "content.action.copy",
  "content.action.view",
  "content.tabs.link",
  "content.tooltips",
  "content.footnote.tooltips",
  "navigation.footer",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "blue"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to dark mode"

[project.extra]
generator = false

[project.extra.analytics]
provider = "google"
property = "G-Z0TYZ35R6G"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/daemonless/fjord"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.com/invite/Kb9tkhecZT"
name = "Discord Community"

[project.plugins]
search = {}
social = { cards_layout_options = { background_color = "#121316" } }
glightbox = { auto = true, auto_themed = true, auto_caption = true, skip_classes = ["no-glb"] }
gh-admonitions = {}
llmstxt = { full_output = "llms-full.txt", sections = { Documentation = ["*.md"] } }

[project.markdown_extensions.tables]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.magiclink]
repo_url_shorthand = true
user = "daemonless"
repo = "fjord"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
