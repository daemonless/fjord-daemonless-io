{% extends "base.html" %}

{#- Link previews (Discord, Mastodon, Slack): Zensical's social plugin is a
    no-op in 0.0.x, so ship one static card for every page. -#}
{% block extrahead %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title if page.title else config.site_name }}">
  <meta property="og:description" content="{{ page.meta.description if page.meta and page.meta.description else config.site_description }}">
  <meta property="og:image" content="{{ config.site_url }}/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
{% endblock %}
